<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Category</title>

<link rel="stylesheet"
      th:href="@{/css/app.css}">

</head>


<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="container">


<h1>Quản lý danh mục</h1>


<a href="/categories/add">
    Thêm danh mục
</a>


<table border="1" width="100%">

<tr>

<th>ID</th>

<th>Tên danh mục</th>

<th>Hình ảnh</th>

<th>Trạng thái</th>

<th>Thao tác</th>

</tr>


<tr th:each="c : ${categories}">


<td th:text="${c.id}"></td>


<td th:text="${c.name}"></td>


<td th:text="${c.images}"></td>


<td th:text="${c.enabled}"></td>


<td>

<a th:href="@{/categories/edit/{id}(id=${c.id})}">
Sửa
</a>


<a th:href="@{/categories/delete/{id}(id=${c.id})}">
Xóa
</a>


</td>


</tr>


</table>


</div>


</body>

</html>
