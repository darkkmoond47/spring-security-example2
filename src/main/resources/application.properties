spring.application.name=spring-security-example2

server.port=8081


spring.thymeleaf.cache=false


spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=webst9;encrypt=true;trustServerCertificate=true

spring.datasource.username=sa

spring.datasource.password=d123456789

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=10MB


# UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true